<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seminar Team Registration</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#667085;--bd:#dfe3ec;--ac:#4f46e5;--ok:#15803d;--er:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#181b24;--tx:#e8eaf0;--mu:#98a2b3;--bd:#2b3040;--ac:#818cf8;--ok:#4ade80;--er:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.5rem;margin:.2em 0}p.s{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin-bottom:18px}
label{display:block;font-weight:600;font-size:.9rem;margin:0 0 4px}
input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input:focus{outline:2px solid var(--ac);border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:start}
.hint{font-size:.82rem;min-height:1.2em;margin:4px 0 12px;color:var(--mu)}.bad{color:var(--er)}.good{color:var(--ok)}
button{font:inherit;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border:0;font-weight:600}button:disabled{opacity:.5;cursor:not-allowed}
#msg{margin-top:12px;font-weight:600}
.t{padding:8px 0;border-top:1px solid var(--bd)}.t:first-child{border-top:0}.t small{color:var(--mu);display:block}
@media(max-width:520px){.row{grid-template-columns:1fr 1fr}.row button{grid-column:1/-1}}
</style></head><body><main>
<h1>Seminar Team Registration</h1>
<p class="s">Pick a unique team title and your members. Each person can join only one team.</p>

<div class="card">
  <label for="title">Team title</label>
  <input id="title" maxlength="80" placeholder="e.g. Robust AI Systems for handling noisy data" autocomplete="off">
  <div class="hint" id="th"></div>
  <label>Members (name &amp; roll no. / student ID)</label>
  <div id="members"></div>
  <div class="hint" id="mh"></div>
  <button id="add" type="button">+ Add member</button>
  <div style="margin-top:16px"><button id="go" class="p" type="button">Submit team</button></div>
  <div id="msg"></div>
</div>

<div class="card"><label>Registered teams (<span id="cnt">0</span>)</label><div id="list"><span class="hint">Loading…</span></div></div>

<script>
// ===== CONFIG =====
const ENDPOINT = "https://script.google.com/macros/s/AKfycbz7AtIyWnSSeWJ2vcJOEc2taI5uOkSjUcLSK8Za3kbBn8TFnrLKenMK7R3j1FighO4-/exec";            // paste your Apps Script Web App URL here
const MIN = 1, MAX = 4;
// ==================
const $ = id => document.getElementById(id);
const norm = s => String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
let teams = [];

function addRow(){
  if($('members').children.length>=MAX) return;
  const d=document.createElement('div');d.className='row';
  d.innerHTML='<input class="n" placeholder="Full name"><input class="i" placeholder="Roll no. / ID"><button type="button" title="Remove">✕</button>';
  d.querySelector('button').onclick=()=>{if($('members').children.length>MIN){d.remove();validate();}};
  d.querySelectorAll('input').forEach(i=>i.oninput=validate);
  $('members').appendChild(d);validate();
}
function vals(){return [...$('members').children].map(r=>({name:r.querySelector('.n').value.trim(),id:r.querySelector('.i').value.trim()}));}

function validate(){
  const t=norm($('title').value);
  const th=$('th');
  if(!t){th.textContent='';}
  else if(teams.some(x=>norm(x.title)===t)){th.textContent='✗ This title is already taken.';th.className='hint bad';}
  else{th.textContent='✓ Title available.';th.className='hint good';}
  const taken=[];const seen=new Set();let dup=false;
  vals().forEach(m=>{const k=norm(m.id);if(!k)return;
    if(seen.has(k))dup=true;seen.add(k);
    const f=teams.find(x=>(x.ids||[]).includes(k));if(f)taken.push(`${m.name||m.id} (in “${f.title}”)`);});
  $('mh').textContent=dup?'✗ Same ID entered twice.':taken.length?'✗ Already registered: '+taken.join(', '):'';
  $('mh').className='hint bad';
  $('add').disabled=$('members').children.length>=MAX;
}
function render(){
  $('cnt').textContent=teams.length;
  $('list').innerHTML=teams.length?'':'<span class="hint">No teams yet.</span>';
  teams.forEach(t=>{const d=document.createElement('div');d.className='t';
    d.textContent=t.title;const s=document.createElement('small');s.textContent=t.names.join(', ');d.appendChild(s);$('list').appendChild(d);});
  validate();
}
async function load(){
  if(!ENDPOINT){$('msg').textContent='Demo mode: set ENDPOINT in index.html to save real responses.';return render();}
  try{const r=await fetch(ENDPOINT);const j=await r.json();teams=j.teams||[];}catch(e){$('list').textContent='Could not load teams.';}
  render();
}
$('go').onclick=async()=>{
  const msg=$('msg');msg.className='';msg.textContent='';
  const title=$('title').value.trim(),members=vals();
  if(!title||members.some(m=>!m.name||!m.id)){msg.textContent='Fill in the title and every member.';msg.className='bad';return;}
  if($('th').classList.contains('bad')||$('mh').textContent){msg.textContent='Fix the highlighted problems first.';msg.className='bad';return;}
  $('go').disabled=true;
  try{
    if(!ENDPOINT){teams.push({title,names:members.map(m=>m.name),ids:members.map(m=>norm(m.id))});msg.textContent='Saved (demo only).';msg.className='good';render();}
    else{
      const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({title,members})});
      const txt=await r.text();let j;
      try{j=JSON.parse(txt);}catch(_){throw new Error('Backend did not return JSON. Check deployment access is "Anyone" and you used the /exec URL.');}
      if(j.ok){msg.textContent='🎉 Team registered!';msg.className='good';$('title').value='';$('members').innerHTML='';for(let i=0;i<MIN;i++)addRow();}
      else{msg.textContent=j.error;msg.className='bad';}
      await load();
    }
  }catch(e){msg.textContent=(e&&e.message&&!/fetch/i.test(e.message)?e.message:'Could not reach the backend (blocked, wrong URL or access not set to Anyone). Details: '+e);msg.className='bad';}
  $('go').disabled=false;
};
$('title').oninput=validate;$('add').onclick=addRow;
for(let i=0;i<MIN;i++)addRow();
load();
</script></main></body></html>
